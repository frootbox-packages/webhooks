# German texts of the webhooks: screen, form, deliveries and errors (decision 0253).
"Webhooks": "Webhooks"
"Tell other services about changes, signed after Standard Webhooks and sent in the background": "Andere Dienste über Änderungen informieren, signiert nach Standard Webhooks und im Hintergrund gesendet"
"Tell other services when something changes here, e.g. a shop or a newsletter tool. Each message is signed and sent in the background.": "Andere Dienste erfahren, wenn sich hier etwas ändert, z. B. ein Shop oder ein Newsletter-Werkzeug. Jede Nachricht ist signiert und geht im Hintergrund raus."
"New webhook": "Neuer Webhook"
"No webhooks yet": "Noch keine Webhooks"
"A webhook sends a message to an address whenever one of the chosen actions happens.": "Ein Webhook schickt eine Nachricht an eine Adresse, sobald eine der gewählten Aktionen passiert."
"{count} action": { one: "{count} Aktion", other: "{count} Aktionen" }
"Last delivery": "Letzte Zustellung"
"Active": "Aktiv"
"Paused": "Pausiert"
"Paused after failures": "Pausiert nach Fehlern"
"Waiting": "Wartet"
"Retrying": "Neuer Versuch"
"Delivered": "Zugestellt"
"Failed": "Gescheitert"
"Skipped": "Übersprungen"
"No delivery succeeded for {days} days, so the webhook was paused on {time}. Check the address, then resume it.": "{days} Tage lang ist keine Zustellung gelungen, deshalb wurde der Webhook am {time} pausiert. Prüfe die Adresse und setze ihn dann fort."
"The webhook is paused. Nothing is sent until you resume it.": "Der Webhook ist pausiert. Bis Du ihn fortsetzt, wird nichts gesendet."
"Resume": "Fortsetzen"
"The webhook is active again.": "Der Webhook ist wieder aktiv."
"Pause": "Pausieren"
"The webhook is paused.": "Der Webhook ist pausiert."
"Send a test": "Probe senden"
"A test event is on its way.": "Eine Probe ist unterwegs."
"New secret": "Neues Geheimnis"
"Copy the new secret now": "Kopiere das neue Geheimnis jetzt"
"It is shown only this once. The old one no longer works; the receiver needs the new one.": "Es wird nur dieses eine Mal angezeigt. Das alte gilt nicht mehr, der Empfänger braucht das neue."
"Title": "Titel"
"e.g. Shop sync": "z. B. Abgleich mit dem Shop"
"Address": "Adresse"
"Only https:// and an address on the internet. Each message is signed after Standard Webhooks with the secret of the webhook.": "Nur https:// und eine Adresse im Internet. Jede Nachricht ist nach Standard Webhooks mit dem Geheimnis des Webhooks signiert."
"Send on these actions": "Senden bei diesen Aktionen"
"\"All\" includes actions that come later, e.g. with a new module.": "„Alle“ umfasst auch Aktionen, die später dazukommen, z. B. mit einem neuen Modul."
"{count} of {total} chosen": "{count} von {total} gewählt"
"All of {group}": "Alle aus {group}"
"Save": "Speichern"
"Set up the webhook": "Webhook einrichten"
"Cancel": "Abbrechen"
"The webhook is saved.": "Der Webhook ist gespeichert."
"The webhook is set up.": "Der Webhook ist eingerichtet."
"Copy the secret now": "Kopiere das Geheimnis jetzt"
"It is shown only this once. The receiver checks each message with it.": "Es wird nur dieses eine Mal angezeigt. Der Empfänger prüft damit jede Nachricht."
"Done": "Fertig"
"Deliveries": "Zustellungen"
"No deliveries yet": "Noch keine Zustellungen"
"They show up here for 30 days, with the answer of the address.": "Sie stehen hier 30 Tage lang, mit der Antwort der Adresse."
"{count} attempt": { one: "{count} Versuch", other: "{count} Versuche" }
"Status {code}": "Status {code}"
"Message": "Nachricht"
"Send again": "Erneut senden"
"Send {action} again": "{action} erneut senden"
"The delivery is on its way again.": "Die Zustellung ist wieder unterwegs."
"Make a new secret?": "Neues Geheimnis erzeugen?"
"The old secret stops working at once. Until the receiver has the new one, it rejects the messages.": "Das alte Geheimnis gilt sofort nicht mehr. Bis der Empfänger das neue hat, lehnt er die Nachrichten ab."
"Make a new secret": "Neues Geheimnis erzeugen"
"The webhook has a new secret.": "Der Webhook hat ein neues Geheimnis."
"Delete": "Löschen"
"Delete {title}?": "{title} löschen?"
"Nothing more is sent to the address, and its deliveries go as well.": "An die Adresse geht nichts mehr, und ihre Zustellungen werden ebenfalls gelöscht."
"The webhook is deleted.": "Der Webhook ist gelöscht."
# Errors of the actions and the deliveries
"Enter an address with https://.": "Gib eine Adresse mit https:// ein."
"Enter an address with https:// or http://.": "Gib eine Adresse mit https:// oder http:// ein."
"An address with a user name or password is not allowed. Check the signature instead.": "Eine Adresse mit Benutzername oder Passwort ist nicht erlaubt. Prüfe stattdessen die Signatur."
"The address must be reachable from the internet.": "Die Adresse muss aus dem Internet erreichbar sein."
"Choose at least one action.": "Wähle mindestens eine Aktion."
"There is no action \"{name}\".": "Es gibt keine Aktion „{name}“."
"Webhooks need APP_SECRET in .env to keep their secret. Add it and try again.": "Webhooks brauchen APP_SECRET in der .env, um ihr Geheimnis zu verwahren. Ergänze es und versuche es noch einmal."
"Only a failed or skipped delivery can be sent again.": "Nur eine gescheiterte oder übersprungene Zustellung lässt sich erneut senden."
"The webhook is gone.": "Den Webhook gibt es nicht mehr."
"The secret cannot be read, e.g. because APP_SECRET changed. Make a new secret.": "Das Geheimnis lässt sich nicht lesen, z. B. weil sich APP_SECRET geändert hat. Erzeuge ein neues Geheimnis."
